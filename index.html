<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>เซียมซี - Siam Si Fortune Sticks</title>
  <meta name="description" content="เซียมซีออนไลน์ เขย่ามือถือเสี่ยงเซียมซี">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assestes/styles.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <div class="particles" id="particles"></div>

  <!-- Permission Screen -->
  <div class="permission-screen" id="permissionScreen">
    <div class="icon">📿</div>
    <h2>เซียมซีออนไลน์</h2>
    <p>กรุณาอนุญาตการใช้เซ็นเซอร์เพื่อเขย่าเซียมซี</p>
    <button class="btn btn-primary" id="btnPermission">เริ่มเสี่ยงเซียมซี</button>
  </div>

  <!-- Main App -->
  <div class="app-container">
    <header class="header">
      <h1>เซียมซี</h1>
      <p class="subtitle">✦ เสี่ยงทาย ✦</p>
    </header>

    <div class="siamsi-section">
      <div class="container-wrapper" id="containerWrapper">
        <canvas id="siamsiCanvas"></canvas>
        <div class="stick-number-overlay" id="stickNumberOverlay">
          <span id="stickNumber"></span>
        </div>
        <div class="sparkle-burst" id="sparkleBurst"></div>
      </div>

      <div class="shake-meter" id="shakeMeter">
        <div class="shake-meter-fill" id="shakeMeterFill"></div>
      </div>

      <div class="instruction" id="instruction">
        <span class="shake-icon">📳</span>
        <p>เขย่ามือถือเพื่อเสี่ยงเซียมซี</p>
        <p class="hint">หรือแตะที่กระบอกเซียมซีหลายๆ ครั้ง</p>
      </div>

      <div class="desktop-tap-area" id="desktopTap">
        <button class="btn-tap" id="btnTap">🎋 เขย่าเซียมซี</button>
      </div>
    </div>
  </div>

  <!-- Fortune Popup -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-card">
      <div class="popup-ornament">🪷</div>
      <div class="popup-stick-number" id="popupStickNum"></div>
      <div class="popup-fortune-title" id="popupTitle"></div>
      <div class="popup-divider"></div>
      <div class="popup-fortune-text" id="popupText"></div>
      <div class="popup-fortune-advice" id="popupAdvice"></div>
      <div class="luck-rating" id="luckRating">
        <span class="label">ดวง:</span>
        <div class="luck-stars" id="luckStars"></div>
      </div>
      <div class="popup-actions">
        <button class="btn btn-secondary" id="btnShare">แชร์</button>
        <button class="btn btn-primary" id="btnAgain">เสี่ยงอีกครั้ง</button>
      </div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ===== Fortune Data =====
    const FORTUNES = [
      { num: 1, title: "มหาโชค", level: 5, text: "ดวงของท่านรุ่งเรืองยิ่งนัก การงานจะก้าวหน้า เงินทองไหลมาเทมา", advice: "ให้ทำบุญใส่บาตร สิ่งดีๆ จะเข้ามาอย่างต่อเนื่อง" },
      { num: 2, title: "โชคดี", level: 4, text: "สิ่งที่หวังจะสมปรารถนา มีคนช่วยเหลือ ให้ทำดีต่อไป", advice: "อย่าลืมช่วยเหลือผู้อื่นเช่นกัน ดวงจะดีต่อเนื่อง" },
      { num: 3, title: "ดีมาก", level: 4, text: "ดวงความรักสดใส มีเนื้อคู่เข้ามา หรือความรักเดิมจะแน่นแฟ้นขึ้น", advice: "เปิดใจให้กว้าง สิ่งดีๆ กำลังจะเข้ามา" },
      { num: 4, title: "ปานกลาง", level: 3, text: "ดวงกำลังเปลี่ยนแปลง ให้อดทนรอคอย สิ่งดีกำลังจะมาถึง", advice: "ให้สวดมนต์ภาวนา จิตใจจะสงบ ดวงจะดีขึ้น" },
      { num: 5, title: "มีอุปสรรค", level: 2, text: "ระวังคนไม่จริงใจ อย่าไว้ใจง่ายเกินไป ให้ระมัดระวังตัว", advice: "ทำบุญไถ่ชีวิตสัตว์ จะช่วยเสริมดวงให้ดีขึ้น" },
      { num: 6, title: "โชคลาภ", level: 5, text: "มีโชคลาภเข้ามา อาจได้ลาภลอย ให้ทำบุญเสริมดวง", advice: "ให้เก็บรักษาทรัพย์สินให้ดี อย่าใจร้อนใช้จ่าย" },
      { num: 7, title: "สมหวัง", level: 4, text: "สิ่งที่ตั้งใจไว้จะสำเร็จ แต่ต้องอดทนและพยายาม", advice: "ความพยายามอยู่ที่ไหน ความสำเร็จอยู่ที่นั่น" },
      { num: 8, title: "ระวังตัว", level: 2, text: "ดวงมีเกณฑ์พบอุปสรรค ให้ระวังเรื่องสุขภาพและการเงิน", advice: "ให้ไหว้พระ ทำบุญ ถือศีล จะช่วยลดทอนเคราะห์" },
      { num: 9, title: "ก้าวหน้า", level: 4, text: "การงานจะก้าวหน้า มีโอกาสดีเข้ามา ให้คว้าไว้อย่าปล่อย", advice: "ให้ตั้งใจทำงานอย่างจริงจัง ผลตอบแทนจะคุ้มค่า" },
      { num: 10, title: "พบสุข", level: 5, text: "ชีวิตครอบครัวจะมีความสุข เรื่องร้ายจะกลายเป็นดี", advice: "ให้ดูแลคนรอบข้าง ความสุขจะทวีคูณ" },
      { num: 11, title: "รอคอย", level: 3, text: "ยังไม่ถึงเวลา ให้อดทนรอคอย ทุกอย่างจะดีขึ้นเอง", advice: "อย่าใจร้อน ให้เตรียมตัวให้พร้อมรับสิ่งดีๆ" },
      { num: 12, title: "เปลี่ยนแปลง", level: 3, text: "จะมีการเปลี่ยนแปลงครั้งใหญ่ในชีวิต ให้เตรียมใจรับ", advice: "ทุกการเปลี่ยนแปลงคือโอกาส ให้มองในแง่ดี" },
      { num: 13, title: "ระวังภัย", level: 1, text: "ให้ระวังเรื่องเอกสารและสัญญา อย่าเซ็นอะไรโดยไม่อ่านให้ดี", advice: "สวดมนต์ทุกวัน ทำจิตใจให้สงบ เคราะห์จะผ่านพ้น" },
      { num: 14, title: "เจริญรุ่ง", level: 5, text: "ดวงการเงินดีมาก มีโอกาสรวย ให้ขยันและประหยัด", advice: "ให้แบ่งปันความสุขให้ผู้อื่น ดวงจะดียิ่งขึ้น" },
      { num: 15, title: "คู่ครอง", level: 4, text: "จะพบเนื้อคู่ที่ดี หรือความรักจะเบ่งบาน ให้เปิดใจ", advice: "รักษาความดีงาม คนดีจะเข้ามาในชีวิต" },
      { num: 16, title: "ทุกข์ชั่วคราว", level: 2, text: "มีทุกข์ แต่เป็นเพียงชั่วคราว ให้อดทน ฟ้าหลังฝนย่อมสดใส", advice: "ให้ปล่อยวาง อย่ายึดติด ทุกข์จะผ่านไป" },
      { num: 17, title: "การเดินทาง", level: 3, text: "จะมีการเดินทางไกล อาจได้พบสิ่งดีๆ ระหว่างทาง", advice: "ให้เปิดใจรับประสบการณ์ใหม่ๆ จะได้เรียนรู้สิ่งดีๆ" },
      { num: 18, title: "มั่งคั่ง", level: 5, text: "ดวงการเงินรุ่งเรือง มีรายได้เพิ่ม ธุรกิจเจริญ", advice: "อย่าลืมทำบุญ แบ่งปัน จะยิ่งเจริญ" },
      { num: 19, title: "สุขภาพดี", level: 4, text: "สุขภาพแข็งแรง ให้ดูแลตัวเองต่อไป มีพลังในการทำสิ่งต่างๆ", advice: "ออกกำลังกายสม่ำเสมอ พักผ่อนให้เพียงพอ" },
      { num: 20, title: "ปัญหา", level: 2, text: "จะพบปัญหาเล็กน้อย แต่สามารถแก้ไขได้ ให้ใจเย็น", advice: "ให้ปรึกษาผู้ใหญ่ที่ไว้ใจได้ จะได้คำตอบที่ดี" },
      { num: 21, title: "แสงสว่าง", level: 4, text: "ความมืดจะหายไป สิ่งที่รอคอยกำลังจะมาถึง", advice: "ให้มีความหวัง อย่ายอมแพ้ สิ่งดีใกล้เข้ามาแล้ว" },
      { num: 22, title: "ขัดแย้ง", level: 2, text: "ระวังการทะเลาะเบาะแว้ง ให้ใจเย็น อย่าใช้อารมณ์", advice: "นับ 1-10 ก่อนพูด ให้สติอยู่กับตัวเสมอ" },
      { num: 23, title: "พบมิตร", level: 4, text: "จะได้พบเพื่อนแท้ มีคนมาช่วยเหลือเมื่อยามลำบาก", advice: "เป็นเพื่อนที่ดีกับทุกคน สิ่งดีจะย้อนกลับมา" },
      { num: 24, title: "ชัยชนะ", level: 5, text: "จะประสบความสำเร็จในสิ่งที่ท้าทาย ชนะคู่แข่ง", advice: "ให้ถ่อมตัว ชัยชนะที่แท้คือการชนะใจตัวเอง" },
      { num: 25, title: "สงบสุข", level: 3, text: "ชีวิตจะสงบสุข ไม่มีเรื่องวุ่นวาย ให้เพลิดเพลินกับปัจจุบัน", advice: "ให้ซื่อสัตย์กับตัวเอง ความสงบคือความสุขที่แท้จริง" },
      { num: 26, title: "ลาภลอย", level: 5, text: "มีโชคลาภโดยไม่คาดคิด อาจได้ของขวัญหรือสิ่งพิเศษ", advice: "ให้ทำบุญตอบแทน สิ่งดีจะวนกลับมา" },
      { num: 27, title: "ต้องอดทน", level: 2, text: "ยังต้องอดทนอีกสักระยะ ให้เก็บเงิน ระวังรายจ่าย", advice: "ความอดทนคือกุญแจสู่ความสำเร็จ" },
      { num: 28, title: "ดวงดี", level: 4, text: "ทุกอย่างจะราบรื่น สิ่งที่ทำจะสำเร็จ ให้มั่นใจในตัวเอง", advice: "จงเชื่อมั่นในตัวเอง ท่านมีศักยภาพมากกว่าที่คิด" }
    ];

    // ===== State =====
    let shakeProgress = 0;
    let isShaking = false;
    let isRevealed = false;
    let hasGyro = false;
    let lastAccel = { x: 0, y: 0, z: 0 };
    const SHAKE_THRESHOLD = 30;
    const SHAKE_GOAL = 100;

    // ===== Stick Physics =====
    const physics = {
      angleX: 0, angleZ: 0,   // current tilt angles (degrees)
      velX: 0, velZ: 0,       // angular velocity
      spring: 0.15,           // spring constant (pulls back to center)
      damping: 0.88,          // friction (0-1, lower = more damping)
      riseY: 0,               // how far stick has risen (0 = inside, 1 = fully out)
      rising: false
    };

    // ===== DOM =====
    const $ = id => document.getElementById(id);
    const containerWrapper = $('containerWrapper');
    const stickNumber = $('stickNumber');
    const stickNumberOverlay = $('stickNumberOverlay');
    const shakeMeter = $('shakeMeter');
    const shakeMeterFill = $('shakeMeterFill');
    const popupOverlay = $('popupOverlay');
    const permissionScreen = $('permissionScreen');
    const sparkleBurst = $('sparkleBurst');
    const instruction = $('instruction');

    // ===== Three.js Setup =====
    const canvas = $('siamsiCanvas');
    const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Cap pixel ratio for performance
    
    const scene = new THREE.Scene();
    
    // Camera
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
    // Move camera back a bit more dynamically to ensure it fits regardless of screen height
    camera.position.set(0, 0.18, 3.8);
    camera.lookAt(0, 0, 0);
    
    // Resize Handler
    const resizeThree = () => {
      const newRect = containerWrapper.getBoundingClientRect();
      if (newRect.width === 0 || newRect.height === 0) return;
      renderer.setSize(newRect.width, newRect.height);
      camera.aspect = newRect.width / newRect.height;
      camera.updateProjectionMatrix();
    };
    
    window.addEventListener('resize', resizeThree);
    window.addEventListener('load', resizeThree);
    resizeThree();
    
    if ('ResizeObserver' in window) {
      const resizeObserver = new ResizeObserver(resizeThree);
      resizeObserver.observe(containerWrapper);
    }
    
    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 5, 5);
    scene.add(dirLight);

    const sticks = []; // Store loaded stick meshes
    let chosenStickIndex = -1; // Stick to rise

    const loader = new GLTFLoader();

    // Load Container
    loader.load('assestes/Container.glb', (gltf) => {
      const containerModel = gltf.scene;
      containerModel.rotation.y = -Math.PI / 2; // Face front (negative 90 degrees)
      
      // Auto-center container
      const box = new THREE.Box3().setFromObject(containerModel);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      
      // Normalize scale so container is always roughly 2 units tall
      const scale = 2.0 / size.y;
      containerModel.scale.setScalar(scale);
      
      // Center it using the bounding box center to compensate for off-center geometry
      containerModel.position.x = -center.x * scale;
      containerModel.position.z = -center.z * scale;
      containerModel.position.y = -center.y * scale - 0.16; // Lower the model slightly so it sits in the visible middle
      
      scene.add(containerModel);
    });

    // Load 7 Sticks
    const stickFiles = ['stick1.glb', 'stick2.glb', 'stick3.glb', 'stick4.glb', 'stick5.glb', 'stick6.glb', 'stick7.glb'];
    
    stickFiles.forEach((file, index) => {
      loader.load('assestes/' + file, (gltf) => {
        const stickMesh = gltf.scene;
        
        // Auto-center stick mesh
        const box = new THREE.Box3().setFromObject(stickMesh);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        
        // Scale sticks to match container proportions
        const stickScale = 1.8 / size.y; // Make sticks roughly 1.8 units long
        stickMesh.scale.setScalar(stickScale);
        
        // Center perfectly on X and Z, and push UP so the pivot of the group is at the BOTTOM of the stick
        stickMesh.position.x = -center.x * stickScale;
        stickMesh.position.z = -center.z * stickScale;
        stickMesh.position.y = -center.y * stickScale + (size.y * stickScale) / 2; 

        // Create a pivot group for physics rotation
        const stickPivot = new THREE.Group();
        stickPivot.add(stickMesh);
        
        // Position bundle tightly in the center
        const angleBase = ((index - 3) * 6) * (Math.PI / 180); // Bundle fan spread
        const posX = (index - 3) * 0.02;
        const posZ = (Math.random() - 0.5) * 0.05;
        
        stickPivot.position.set(posX, -0.6, posZ); // Placed at bottom inside container
        stickPivot.rotation.z = angleBase;
        
        // Save initial state for physics reset
        stickPivot.userData = {
          baseX: posX,
          baseY: -0.6,
          baseZ: posZ,
          baseRotZ: angleBase
        };

        scene.add(stickPivot);
        sticks.push(stickPivot);
      });
    });
    // Removed duplicate const declarations

    // ===== Particles =====
    (function initParticles() {
      const container = $('particles');
      for (let i = 0; i < 20; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDelay = Math.random() * 8 + 's';
        p.style.animationDuration = (6 + Math.random() * 4) + 's';
        p.style.width = (2 + Math.random() * 4) + 'px';
        p.style.height = p.style.width;
        container.appendChild(p);
      }
    })();

    // ===== Permission / Gyro Setup =====
    $('btnPermission').addEventListener('click', async () => {
      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const perm = await DeviceMotionEvent.requestPermission();
          if (perm === 'granted') { startMotion(); }
          else { fallbackToTap(); }
        } catch { fallbackToTap(); }
      } else if ('DeviceMotionEvent' in window) {
        startMotion();
      } else {
        fallbackToTap();
      }
      permissionScreen.classList.add('hidden');
    });

    function startMotion() {
      hasGyro = true;
      window.addEventListener('devicemotion', handleMotion, true);
    }

    function fallbackToTap() {
      hasGyro = false;
      document.body.classList.add('no-gyro');
    }

    if (!('DeviceMotionEvent' in window) || /Macintosh|Windows/.test(navigator.userAgent)) {
      permissionScreen.classList.add('hidden');
      fallbackToTap();
    }

    // ===== Motion Handler =====
    function handleMotion(e) {
      if (isRevealed) return;
      const a = e.accelerationIncludingGravity;
      if (!a) return;
      const dx = a.x - lastAccel.x;
      const dy = a.y - lastAccel.y;
      const dz = a.z - lastAccel.z;
      const delta = Math.abs(dx) + Math.abs(dy) + Math.abs(dz);
      lastAccel = { x: a.x, y: a.y, z: a.z };

      // Apply force to stick physics based on device motion
      if (delta > 5) {
        physics.velX += dx * 0.8;
        physics.velZ += dz * 0.8;
      }

      // Only count as progress if shake is hard enough
      if (delta > SHAKE_THRESHOLD) {
        const intensity = (delta - SHAKE_THRESHOLD) / 10;
        const amount = Math.min(intensity * 3, 12);
        addShake(amount);
      }
    }

    function addShake(amount) {
      if (isRevealed) return;
      shakeProgress = Math.min(SHAKE_GOAL, shakeProgress + amount);
      updateShakeUI();
      if (!isShaking) {
        isShaking = true;
        shakeMeter.classList.add('visible');
      }
      if (shakeProgress >= SHAKE_GOAL) {
        revealFortune();
      }
    }

    function updateShakeUI() {
      const pct = (shakeProgress / SHAKE_GOAL) * 100;
      shakeMeterFill.style.width = pct + '%';
    }

    // ===== Physics Loop (60fps) =====
    function physicsLoop() {
      if (!physics.rising) {
        // Spring: pull back to center
        physics.velX -= physics.angleX * physics.spring;
        physics.velZ -= physics.angleZ * physics.spring;
        // Damping
        physics.velX *= physics.damping;
        physics.velZ *= physics.damping;
        // Integrate
        physics.angleX += physics.velX;
        physics.angleZ += physics.velZ;
        // Clamp angles
        physics.angleX = Math.max(-25, Math.min(25, physics.angleX));
        physics.angleZ = Math.max(-25, Math.min(25, physics.angleZ));
      } else {
        // Rising animation - lerp Y upward, dampen wobble
        physics.riseY = Math.min(1, physics.riseY + 0.012);
        physics.velX *= 0.95;
        physics.velZ *= 0.95;
        physics.angleX += physics.velX;
        physics.angleZ += physics.velZ;
        physics.angleX *= 0.97;
        physics.angleZ *= 0.97;
      }

      // Apply wobble to all sticks
      sticks.forEach((stick, i) => {
        // Add some random variation per stick based on index
        const varX = Math.sin(Date.now() * 0.005 + i) * (Math.abs(physics.velX) * 0.1);
        const varZ = Math.cos(Date.now() * 0.005 + i) * (Math.abs(physics.velZ) * 0.1);
        
        stick.rotation.x = (physics.angleX * 0.3 + varX) * (Math.PI / 180);
        stick.rotation.z = stick.userData.baseRotZ + (physics.angleZ + varZ) * (Math.PI / 180);
        
        // If this stick is chosen to rise
        if (physics.rising && i === chosenStickIndex) {
          const riseAmount = physics.riseY * 1.5; // adjust height as needed
          stick.position.y = stick.userData.baseY + riseAmount;
          stick.position.x = stick.userData.baseX + (physics.riseY * 0.1); // Move slightly to front/side
          stick.position.z = stick.userData.baseZ + (physics.riseY * 0.2);
        }
      });

      renderer.render(scene, camera);
      requestAnimationFrame(physicsLoop);
    }
    requestAnimationFrame(physicsLoop);

    // ===== Tap/Click =====
    const TAP_AMOUNT = 20;
    let tappedByTouch = false;

    const siamiSection = document.querySelector('.siamsi-section');
    const tapTargets = [containerWrapper, siamiSection];
    const btnTap = $('btnTap');
    if (btnTap) tapTargets.push(btnTap);

    tapTargets.forEach(el => {
      el.addEventListener('contextmenu', e => e.preventDefault());
      el.style.webkitUserSelect = 'none';
      el.style.userSelect = 'none';
      el.style.webkitTouchCallout = 'none';

      el.addEventListener('touchend', (e) => {
        e.preventDefault();
        tappedByTouch = true;
        doTap();
        setTimeout(() => { tappedByTouch = false; }, 400);
      }, { passive: false });

      el.addEventListener('click', () => {
        if (tappedByTouch) return;
        doTap();
      });
    });

    function doTap() {
      if (isRevealed) return;
      // Add random jolt to stick physics
      physics.velX += (Math.random() - 0.5) * 30;
      physics.velZ += (Math.random() - 0.5) * 30;
      addShake(TAP_AMOUNT);
    }

    // ===== Reveal Fortune =====
    function revealFortune() {
      if (isRevealed) return;
      isRevealed = true;
      shakeMeter.classList.remove('visible');
      instruction.style.opacity = '0';

      const fortune = FORTUNES[Math.floor(Math.random() * FORTUNES.length)];
      stickNumber.textContent = fortune.num;

      // Pick a random stick to rise
      if (sticks.length > 0) {
        chosenStickIndex = Math.floor(Math.random() * sticks.length);
      }

      // Start stick rising via physics
      physics.rising = true;
      physics.velX = (Math.random() - 0.5) * 10;
      physics.velZ = 5 + Math.random() * 5;

      setTimeout(() => {
        stickNumberOverlay.classList.add('visible');
      }, 1000);

      createSparkles();
      setTimeout(() => showPopup(fortune), 2800);
    }

    function createSparkles() {
      sparkleBurst.innerHTML = '';
      for (let i = 0; i < 12; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        const angle = (i / 12) * Math.PI * 2;
        const dist = 40 + Math.random() * 60;
        s.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
        s.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
        s.style.animationDelay = Math.random() * 0.3 + 's';
        sparkleBurst.appendChild(s);
      }
    }

    // ===== Popup =====
    function showPopup(fortune) {
      $('popupStickNum').textContent = `เซียมซี ใบที่ ${fortune.num}`;
      $('popupTitle').textContent = fortune.title;
      $('popupText').textContent = fortune.text;
      $('popupAdvice').textContent = `💡 ${fortune.advice}`;

      const starsEl = $('luckStars');
      starsEl.innerHTML = '';
      for (let i = 0; i < 5; i++) {
        const star = document.createElement('span');
        star.className = 'star' + (i >= fortune.level ? ' empty' : '');
        star.textContent = '⭐';
        star.style.animationDelay = (i * 0.15) + 's';
        starsEl.appendChild(star);
      }

      popupOverlay.classList.add('active');
    }

    function hidePopup() {
      popupOverlay.classList.remove('active');
    }

    // ===== Reset =====
    function resetGame() {
      hidePopup();
      setTimeout(() => {
        isRevealed = false;
        isShaking = false;
        shakeProgress = 0;
        shakeMeter.classList.remove('visible');
        shakeMeterFill.style.width = '0%';
        instruction.style.opacity = '1';
        sparkleBurst.innerHTML = '';
        stickNumberOverlay.classList.remove('visible');
        // Reset physics
        physics.angleX = 0;
        physics.angleZ = 0;
        physics.velX = 0;
        physics.velZ = 0;
        physics.riseY = 0;
        physics.rising = false;
        chosenStickIndex = -1;
        
        // Snap sticks back
        sticks.forEach(stick => {
          stick.position.x = stick.userData.baseX;
          stick.position.y = stick.userData.baseY;
          stick.position.z = stick.userData.baseZ;
        });
      }, 400);
    }

    $('btnAgain').addEventListener('click', resetGame);
    $('btnShare').addEventListener('click', () => {
      const title = $('popupTitle').textContent;
      const text = $('popupText').textContent;
      const msg = `🪷 เซียมซี: ${title}\n${text}`;
      if (navigator.share) {
        navigator.share({ title: 'เซียมซี', text: msg }).catch(() => {});
      } else {
        navigator.clipboard.writeText(msg).then(() => alert('คัดลอกแล้ว!')).catch(() => {});
      }
    });
  </script>
</body>
</html>
